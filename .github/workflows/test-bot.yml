name: Test Google Form Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.63.0

      - name: Запустить бота
        run: python bot.py